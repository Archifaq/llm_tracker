# Offline demo config -- lets you try the CLI/report interface end-to-end
# with ZERO API keys and ZERO cost, while a real OPENAI_API_KEY/GEMINI_API_KEY/
# PERPLEXITY_API_KEY is being arranged with your management.
#
# Same market/brand/competitors/queries as config.example.toml; the only
# difference is the [[providers]] section below, which uses
# `kind = "offline"` -- a deterministic, no-network, no-API-key adapter (see
# src/e100_visibility/providers/offline_provider.py) that stands in for two
# "LLM assistants" so you can see the multi-provider report, share-of-voice
# comparison, and run-over-run trend exactly as they'll look with real
# providers.
#
# Run it with:
#   e100-visibility run --config config.demo.toml
# then run it again to see the trend section populate.
#
# This file is NOT a template to copy for real use -- for that, use
# config.example.toml instead.

queries = [
  "Jakie są najlepsze karty paliwowe dla firm w Polsce?",
  "Polecane karty flotowe dla małej firmy transportowej",
  "Ranking kart paliwowych dla firm 2026",
  "Jak wybrać kartę paliwową dla floty pojazdów?",
  "Karta paliwowa dla jednoosobowej działalności gospodarczej – co polecacie?",
  "Karty paliwowe bez limitu kredytowego dla firm",
  "Najlepsza karta paliwowa dla przewoźników międzynarodowych (tankowanie w całej Europie)",
  "Karty paliwowe z aplikacją mobilną i raportowaniem wydatków",
  "Porównanie kart paliwowych dostępnych na polskim rynku",
  "Ile kosztuje karta paliwowa dla firmy i jakie są opłaty?",
  "Karta paliwowa dla dużej floty samochodów dostawczych",
  "Jakie firmy oferują karty paliwowe dla biznesu w Polsce?",
  "Karty paliwowe umożliwiające tankowanie na wielu sieciach stacji",
  "Opinie o kartach paliwowych dla firm – co wybrać?",
  "Karta flotowa z rabatem na paliwo dla firm transportowych",
  "Jak zarządzać wydatkami na paliwo w firmie – jakie narzędzia/karty pomagają?",
  "Karta paliwowa dla firmy jednoosobowej vs dla dużej floty – różnice",
  "Najlepsze rozwiązania płatnicze dla flot samochodowych w Polsce",
]

[market]
language = "pl"
country = "PL"
label = "Poland (demo)"

[brand]
name = "E100"
domain = "e100.eu"
aliases = ["E100", "e100.eu", "Е100", "E 100", "E-100"]

[[competitors]]
name = "DKV"
aliases = ["DKV", "DKV Mobility"]

[[competitors]]
name = "UTA"
aliases = ["UTA", "UTA Edenred"]

[[competitors]]
name = "Shell"
aliases = ["Shell", "Shell Card", "Karta Shell"]

# Two offline "providers" (not real APIs) so the report shows a realistic
# multi-provider comparison. `name` differs between them so their canned
# answers -- picked deterministically per (name, query) -- differ too, the
# same way two different real LLMs would disagree on some queries.
[[providers]]
name = "demo-assistant-a"
kind = "offline"
model = "offline-demo"
api_key_env = "UNUSED"
enabled = true

[[providers]]
name = "demo-assistant-b"
kind = "offline"
model = "offline-demo"
api_key_env = "UNUSED"
enabled = true

[analysis]
method = "heuristic"

[storage]
path = "output/demo/history.sqlite3"

[report]
output_dir = "output/demo"
